<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Synthèse du Jour</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #1a2233;
    --panel-2: #212b42;
    --text: #e8ecf4;
    --muted: #8b95ab;
    --accent: #4f8cff;
    --accent-2: #7c5cff;
    --border: rgba(255,255,255,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 70% -10%, #1d2a4a 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,20,32,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .date-bar {
    display: flex; align-items: center; justify-content: center;
    gap: 18px; padding: 16px 12px; max-width: 1100px; margin: 0 auto;
  }
  .nav-btn {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 50%;
    width: 46px; height: 46px; font-size: 20px; cursor: pointer;
    transition: all .2s; flex-shrink: 0;
  }
  .nav-btn:hover { background: var(--accent); transform: scale(1.06); }
  .nav-btn:disabled { opacity: .35; cursor: default; transform: none; background: var(--panel-2); }
  .date-label { text-align: center; min-width: 260px; }
  .date-label .day { font-size: 1.5rem; font-weight: 700; letter-spacing: .5px; }
  .date-label .sub { color: var(--muted); font-size: .85rem; margin-top: 2px; text-transform: uppercase; letter-spacing: 2px; }
  .today-badge {
    display: inline-block; margin-top: 6px; font-size: .7rem; font-weight: 600;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    padding: 3px 12px; border-radius: 20px; letter-spacing: 1px;
  }
  .tabs {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    padding: 0 12px 14px; max-width: 1100px; margin: 0 auto;
  }
  .tab {
    background: transparent; color: var(--muted); border: 1px solid transparent;
    padding: 8px 18px; border-radius: 24px; cursor: pointer; font-size: .9rem;
    font-weight: 600; transition: all .2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }
  .section { display: none; animation: fade .35s ease; }
  .section.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .section h2 { font-size: 1.35rem; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
  .section h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px; transition: transform .2s, border-color .2s;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(79,140,255,.45); }
  .card h3 { font-size: 1.02rem; margin-bottom: 8px; line-height: 1.4; }
  .card p { color: var(--muted); font-size: .9rem; line-height: 1.55; }
  .card .tag {
    display: inline-block; font-size: .68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--accent); margin-bottom: 8px;
  }
  .empty {
    text-align: center; color: var(--muted); padding: 60px 20px;
    background: var(--panel); border: 1px dashed var(--border); border-radius: 14px;
  }
  .swipe-hint { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 34px; }
  @media (max-width: 560px) {
    .date-label { min-width: 0; }
    .date-label .day { font-size: 1.15rem; }
  }
</style>
</head>
<body>

<header>
  <div class="date-bar">
    <button class="nav-btn" id="prevDay" title="Jour précédent">&#8592;</button>
    <div class="date-label">
      <div class="day" id="dateDay">—</div>
      <div class="sub" id="dateSub">—</div>
      <span class="today-badge" id="todayBadge" style="display:none">AUJOURD'HUI</span>
    </div>
    <button class="nav-btn" id="nextDay" title="Jour suivant">&#8594;</button>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-section="nationale">🇫🇷 Nationale</button>
    <button class="tab" data-section="internationale">🌍 Internationale</button>
    <button class="tab" data-section="financiere">📈 Financière</button>
    <button class="tab" data-section="economique">💶 Économique</button>
    <button class="tab" data-section="tech">💻 Technologique</button>
  </nav>
</header>

<main>
  <section class="section active" id="sec-nationale"></section>
  <section class="section" id="sec-internationale"></section>
  <section class="section" id="sec-financiere"></section>
  <section class="section" id="sec-economique"></section>
  <section class="section" id="sec-tech"></section>
  <p class="swipe-hint">← → pour changer de jour · glissez sur mobile · flèches du clavier</p>
</main>

      { t: "Budget 2026 : le débat s'enlise à l'Assemblée", d: "Le projet de budget n'est toujours pas adopté. Philippe Juvin, rapporteur général de la commission des Finances, affirme qu'il est « déjà caduc », tandis que le gouvernement cherche à éviter le recours au 49.3." },

    ],

      { t: "Albanie : manifestations antigouvernementales à Tirana", d: "Des manifestants ont affronté la police à Tirana (cocktails Molotov, canons à eau, gaz lacryogènes) alors que les protestations contre le gouvernement s'intensifiaient." }

      { t: "Semaine boursière décisive : midterms et emploi américain", d: "Les marchés anticipent une semaine volatile : élections de mi-mandat mardi 3 novembre, publication vendredi 6 novembre des chiffres de l'emploi non agricole d'octobre (créations attendues : +65 000 après +29 000 en septembre)." }
    ],
    economique: [
      { t: "BCE : statu quo sur les taux malgré l'inflation", d: "La Banque centrale européenne a maintenu son taux de dépôt à 2,5 %, tout en évaluant les risques inflationnistes liés aux perturbations du marché de l'énergie. La Fed maintient également ses taux inchangés pour l'instant." },
      { t: "Gaz naturel : le prix repère en hausse de 6,6 %", d: "Le prix repère de vente du gaz naturel a augmenté de 6,6 % ce dimanche, poussant des ménages à limiter leur chauffage. Une céréale africaine commence par ailleurs à montrer son potentiel en France face au réchauffement climatique." },
      { t: "Santé mentale : Grande cause nationale 2026", d: "Le gouvernement a fait de la santé mentale la Grande cause nationale de l'année 2026, avec une campagne de sensibilisation lancée à l'occasion de la Toussaint." }
    ],
    tech: [
      { t: "Mistral AI publie les poids de Mistral Large 4 en open-weight", d: "Le champion français de l'IA franchit une étape en rendant publics les poids de son modèle Mistral Large 4, renforçant la dynamique de l'open source européen." },
      { t: "Premier MacBook tactile en approche", d: "Apple préparerait un MacBook Pro doté d'un écran tactile OLED, attendu pour le 6 novembre 2026 — une première pour la gamme MacBook." },
      { t: "Google fait tourner son IA en orbite (Project Suncatcher)", d: "Depuis le 1er octobre, des puces IA de Google fonctionnent directement en orbite à bord d'un satellite lancé par une Falcon 9 de SpaceX, ouvrant la voie à des centres de calcul spatiaux." },
      { t: "Black Friday : les premières offres tech démarrent", d: "Les premières vraies promotions du Black Friday sont déjà en ligne ce dimanche 1er novembre, avec notamment des offres sur les produits high-tech." }
    ]
  },
  "2026-11-02": {
    label: "Lundi 2 novembre 2026",
    nationale: [
      { t: "À la veille des midterms, la France observe Washington", d: "Le scrutin américain de mardi sera suivi de près à Paris : un Congrès démocrate pourrait bloquer la taxe sur le cognac, l'aide militaire à l'Ukraine et d'autres mesures du second mandat de Donald Trump." },
      { t: "Mobilisations : les autorités préparent la suite après le 31 octobre", d: "Après l'acte III du samedi 31 octobre, la coordination des Gilets jaunes appelle à des assemblées de convergence fin novembre pour fédérer les luttes." },
      { t: "Distributeurs reçus à Bercy sur le prix des carburants", d: "Réunion mardi au ministère de l'Économie pour un « premier point national » sur la baisse promise de 12 à 18 centimes du litre après le déblocage des stocks stratégiques." }
    ],
    internationale: [
      { t: "Midterms 2026 : 112 millions d'électeurs attendus mardi", d: "Les 435 sièges de la Chambre des représentants et 35 des 100 sièges du Sénat sont en jeu. Plus de 52 millions de bulletins ont déjà été déposés par vote anticipé. Premiers résultats attendus dans la nuit de mardi à mercredi (heure de Paris)." },

    ],

    ],

      { t: "Dette publique et consommation au cœur des débats", d: "En France comme ailleurs, la combinaison d'une dette élevée, d'une inflation qui repart et de taux durablement hauts continue de peser sur le pouvoir d'achat et la confiance des ménages." }

      { t: "iPad mini OLED avec puce A20 en approche", d: "Le nouvel iPad mini d'Apple, équipé de la puce A20 et d'un écran OLED, a fait sa première apparition sur Geekbench quelques jours avant sa commercialisation prévue le 6 novembre 2026." },

};

const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS_SEM = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

const dates = Object.keys(JOURS).sort();
let index = dates.length - 1;

const SECTIONS = ["nationale","internationale","financiere","economique","tech"];
const TITRES = {
  nationale: "🇫🇷 Nationale",
  internationale: "🌍 Internationale",
  financiere: "📈 Financière",
  economique: "💶 Économique",
  tech: "💻 Technologique"
};

function parseDate(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d);
}

function render() {
  const iso = dates[index];
  const dt = parseDate(iso);
  document.getElementById("dateDay").textContent =
    JOURS_SEM[dt.getDay()].charAt(0).toUpperCase() + JOURS_SEM[dt.getDay()].slice(1) + " " +
    dt.getDate() + " " + MOIS[dt.getMonth()] + " " + dt.getFullYear();
  document.getElementById("dateSub").textContent = "Édition du " + dt.getDate() + " " + MOIS[dt.getMonth()];
  const today = new Date();
  const isToday = dt.toDateString() === today.toDateString();
  document.getElementById("todayBadge").style.display = isToday ? "inline-block" : "none";
  document.getElementById("prevDay").disabled = index === 0;
  document.getElementById("nextDay").disabled = index === dates.length - 1;

  SECTIONS.forEach(s => {
    const el = document.getElementById("sec-" + s);
    const items = JOURS[iso][s] || [];
    if (!items.length) {
      el.innerHTML = '<div class="empty">Aucune synthèse disponible pour ce jour dans cette rubrique.</div>';
      return;
    }
    el.innerHTML = "<h2><span class='dot'></span>" + TITRES[s] + "</h2><div class='cards'>" +
      items.map(it =>
        "<article class='card'><span class='tag'>À retenir</span><h3>" + it.t + "</h3><p>" + it.d + "</p></article>"
      ).join("") + "</div>";
  });
}

document.getElementById("prevDay").addEventListener("click", () => { if (index > 0) { index--; render(); } });
document.getElementById("nextDay").addEventListener("click", () => { if (index < dates.length-1) { index++; render(); } });

document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === btn));
  document.querySelectorAll(".section").forEach(s => s.classList.toggle("active", s.id === "sec-" + btn.dataset.section));
});

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" && index > 0) { index--; render(); }
  if (e.key === "ArrowRight" && index < dates.length-1) { index++; render(); }
});

let touchX = null;
document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, {passive:true});
document.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (dx < -50 && index < dates.length-1) { index++; render(); }
  if (dx > 50 && index > 0) { index--; render(); }
  touchX = null;
}, {passive:true});

render();
</script>
</body>
</html>
