<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Synthèse du Jour — Revue de presse approfondie</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #1a2233;
    --panel-2: #212b42;
    --text: #e8ecf4;
    --muted: #9aa5bb;
    --accent: #4f8cff;
    --accent-2: #7c5cff;
    --gold: #e8b64c;
    --border: rgba(255,255,255,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 70% -10%, #1d2a4a 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,20,32,0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .brand { text-align: center; padding: 14px 0 4px; font-size: .8rem; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  .brand b { color: var(--text); }
  .date-bar {
    display: flex; align-items: center; justify-content: center;
    gap: 18px; padding: 10px 12px 14px; max-width: 1100px; margin: 0 auto;
  }
  .nav-btn {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 50%;
    width: 46px; height: 46px; font-size: 20px; cursor: pointer;
    transition: all .2s; flex-shrink: 0;
  }
  .nav-btn:hover { background: var(--accent); transform: scale(1.06); }
  .nav-btn:disabled { opacity: .35; cursor: default; transform: none; background: var(--panel-2); }
  .date-label { text-align: center; min-width: 260px; }
  .date-label .day { font-size: 1.45rem; font-weight: 700; letter-spacing: .5px; }
  .date-label .sub { color: var(--muted); font-size: .82rem; margin-top: 2px; text-transform: uppercase; letter-spacing: 2px; }
  .today-badge {
    display: inline-block; margin-top: 6px; font-size: .68rem; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    padding: 3px 12px; border-radius: 20px; letter-spacing: 1px;
  }
  .tabs {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    padding: 0 12px 14px; max-width: 1100px; margin: 0 auto;
  }
  .tab {
    background: transparent; color: var(--muted); border: 1px solid transparent;
    padding: 8px 16px; border-radius: 24px; cursor: pointer; font-size: .88rem;
    font-weight: 600; transition: all .2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  .tab.analyse.active { background: linear-gradient(90deg, rgba(232,182,76,.18), rgba(124,92,255,.18)); border-color: rgba(232,182,76,.4); color: var(--gold); }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }
  .section { display: none; animation: fade .35s ease; }
  .section.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .section h2 { font-size: 1.3rem; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
  .section h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px 22px; transition: transform .2s, border-color .2s;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(79,140,255,.45); }
  .card h3 { font-size: 1.05rem; margin-bottom: 9px; line-height: 1.4; }
  .card p { color: var(--muted); font-size: .92rem; line-height: 1.65; }
  .card .tag {
    display: inline-block; font-size: .66rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--accent); margin-bottom: 9px;
  }
  .card .src { display: block; margin-top: 10px; font-size: .74rem; color: #6b7690; font-style: italic; }
  .analyse-card {
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border: 1px solid rgba(232,182,76,.25);
    border-radius: 16px; padding: 26px 30px; max-width: 860px; margin: 0 auto;
  }
  .analyse-card .kicker { color: var(--gold); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
  .analyse-card h3 { font-size: 1.45rem; line-height: 1.35; margin-bottom: 16px; }
  .analyse-card p { color: #c3cbdd; font-size: .98rem; line-height: 1.75; margin-bottom: 14px; }
  .analyse-card p.lead { color: var(--text); font-size: 1.05rem; }
  .analyse-card .srcs { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); font-size: .78rem; color: #6b7690; line-height: 1.7; }
  .empty {
    text-align: center; color: var(--muted); padding: 60px 20px;
    background: var(--panel); border: 1px dashed var(--border); border-radius: 14px;
  }
  footer { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; color: #6b7690; font-size: .76rem; line-height: 1.7; border-top: 1px solid var(--border); }
  .swipe-hint { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 34px; }
  @media (max-width: 560px) {
    .date-label { min-width: 0; }
    .date-label .day { font-size: 1.1rem; }
    .analyse-card { padding: 20px; }
  }
</style>
</head>

<header>

  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-section="nationale">🇫🇷 Nationale</button>
    <button class="tab" data-section="internationale">🌍 Internationale</button>
    <button class="tab" data-section="financiere">📈 Financière</button>
    <button class="tab" data-section="economique">💶 Économique</button>
    <button class="tab" data-section="tech">💻 Technologique</button>
    <button class="tab analyse" data-section="analyse">🔍 Analyse du jour</button>
  </nav>
</header>

<main>
  <section class="section active" id="sec-nationale"></section>
  <section class="section" id="sec-internationale"></section>
  <section class="section" id="sec-financiere"></section>
  <section class="section" id="sec-economique"></section>
  <section class="section" id="sec-tech"></section>
  <section class="section" id="sec-analyse"></section>

</main>

const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS_SEM = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

const dates = Object.keys(JOURS).sort();
let index = dates.length - 1;

const SECTIONS = ["nationale","internationale","financiere","economique","tech","analyse"];
const TITRES = {
  nationale: "🇫🇷 Nationale",
  internationale: "🌍 Internationale",
  financiere: "📈 Financière",
  economique: "💶 Économique",
  tech: "💻 Technologique",
  analyse: "🔍 Analyse du jour"
};

function parseDate(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d);
}

function render() {
  const iso = dates[index];
  const dt = parseDate(iso);
  document.getElementById("dateDay").textContent =
    JOURS_SEM[dt.getDay()].charAt(0).toUpperCase() + JOURS_SEM[dt.getDay()].slice(1) + " " +
    dt.getDate() + " " + MOIS[dt.getMonth()] + " " + dt.getFullYear();
  document.getElementById("dateSub").textContent = "Édition du " + dt.getDate() + " " + MOIS[dt.getMonth()];
  const today = new Date();
  const isToday = dt.toDateString() === today.toDateString();
  document.getElementById("todayBadge").style.display = isToday ? "inline-block" : "none";
  document.getElementById("prevDay").disabled = index === 0;
  document.getElementById("nextDay").disabled = index === dates.length - 1;

  SECTIONS.forEach(s => {
    const el = document.getElementById("sec-" + s);
    const day = JOURS[iso];
    if (s === "analyse") {
      const a = day.analyse;
      if (!a) { el.innerHTML = '<div class="empty">Pas d\'éditorial pour ce jour.</div>'; return; }
      el.innerHTML = "<div class='analyse-card'><div class='kicker'>" + a.kicker + "</div><h3>" + a.title + "</h3>" +
        a.paras.map((p,i) => "<p class='" + (i===0 ? "lead" : "") + "'>" + p + "</p>").join("") +
        "<div class='srcs'>" + a.srcs.join("<br>") + "</div></div>";
      return;
    }
    const items = day[s] || [];
    if (!items.length) {
      el.innerHTML = '<div class="empty">Aucune synthèse disponible pour ce jour dans cette rubrique.</div>';
      return;
    }
    el.innerHTML = "<h2><span class='dot'></span>" + TITRES[s] + "</h2><div class='cards'>" +
      items.map(it =>
        "<article class='card'><span class='tag'>À retenir</span><h3>" + it.t + "</h3><p>" + it.d + "</p>" +
        (it.src ? "<span class='src'>Source : " + it.src + "</span>" : "") + "</article>"
      ).join("") + "</div>";
  });

  document.getElementById("sourcesFooter").innerHTML =
    "<b>Sources utilisées pour cette édition :</b> franceinfo, BFMTV, TF1 Info, RTL, CNews, 20 Minutes, Le Devoir, RTS · Euronews, France 24, ONU Info/UNRIC, Le Grand Continent, Institut Montaigne, IRIS, Ifri, Crisis Group, Chatham House, Foreign Affairs, The Independent · Boursorama, Les Echos, Trading Economics, KuCoin, BRI, FMI, BCE · Frandroid, Numerama, Génération NT, BlogNT, Futura, Techno-Science, World Is Small.<br>Revue de presse réalisée à partir de sources publiques francophones et internationales, citées article par article. Contenu éditorialisé à titre informatif.";
}

document.getElementById("prevDay").addEventListener("click", () => { if (index > 0) { index--; render(); } });
document.getElementById("nextDay").addEventListener("click", () => { if (index < dates.length-1) { index++; render(); } });

document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === btn));
  document.querySelectorAll(".section").forEach(s => s.classList.toggle("active", s.id === "sec-" + btn.dataset.section));
});

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" && index > 0) { index--; render(); }
  if (e.key === "ArrowRight" && index < dates.length-1) { index++; render(); }
});

let touchX = null;
document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, {passive:true});
document.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (dx < -50 && index < dates.length-1) { index++; render(); }
  if (dx > 50 && index > 0) { index--; render(); }
  touchX = null;
}, {passive:true});

render();
</script>
